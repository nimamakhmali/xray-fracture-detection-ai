version: "3.9"

services:

  ai_service:
    build:
      context: .
      target: production
    container_name: ai_service
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./data:/app/data

    environment:
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_PATH=models/production/best_model.pt
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO

    # Uncomment when GPU is available on host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s