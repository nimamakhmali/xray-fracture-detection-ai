dataset:
  name: fracture-detection-combined
  version: 1.0.0
  description: 'Combined dataset from GRAZPEDWRI-DX and FracAtlas for bone fracture
    detection in X-ray images.

    '
sources:
- name: FracAtlas
  description: Multi-region fracture atlas dataset
  url: https://figshare.com/articles/dataset/FracAtlas/22363012
  local_path: ../fracatlas
- name: GRAZPEDWRI-DX
  description: Pediatric wrist X-ray dataset
  url: https://figshare.com/articles/dataset/GRAZPEDWRI-DX/14825193
  local_path: ../GRAZPEDWRI-DX
nc: 1
names:
- fracture
path: /home/nimamakhmali/Documents/Ai Project /xray-fracture-detection-ai/ai_module/data/processed
train: train/images
val: val/images
test: test/images
split:
  train: 0.7
  val: 0.15
  test: 0.15
  random_seed: 42
  stratified: true
image:
  target_size: 640
  channels: 3
  formats_supported:
  - jpg
  - jpeg
  - png
  - dcm
preprocessing:
  apply_clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size:
  - 8
  - 8
  normalize: true
  normalize_mean:
  - 0.485
  - 0.456
  - 0.406
  normalize_std:
  - 0.229
  - 0.224
  - 0.225
stats:
  total_images: 24337
  train_images: 16983
  val_images: 3686
  test_images: 3668
  fracture_positive: 14263
  fracture_negative: 10074
  by_dataset:
    fracatlas: 4010
    grazpedwri: 20327
  annotation_status_distribution:
    positive_clean: 14263
    negative_clean: 10074
  avg_image_width: 562.1
  avg_image_height: 947.2
  avg_annotations_per_image: 0.781
  generated_by: scripts/prepare_dataset.py (v2)
  random_seed: 42
  dropped_total: 58
  dropped_by_reason:
    image_integrity_failed: 58
